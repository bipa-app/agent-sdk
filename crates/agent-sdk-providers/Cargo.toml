[package]
name = "agent-sdk-providers"
version = "0.17.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "LLM provider trait, streaming primitives, and first-party provider implementations for the Agent SDK"
readme = "README.md"
keywords = ["agent", "llm", "anthropic", "openai", "gemini"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
agent-sdk-foundation = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util"] }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
native-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
async-stream = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
# WebSocket transport — only the OpenAI Codex / ChatGPT provider needs it,
# so it is gated behind the `openai-codex` feature.
tokio-tungstenite = { workspace = true, optional = true }

[features]
# Anthropic is the default provider so the common case works out of the box.
default = ["anthropic", "structured-output", "tls-native-tls"]

# ── TLS backend (pick exactly one) ─────────────────────────────────────
# The backend is the consumer's call: an app already on rustls should not be
# made to link OpenSSL too. Selecting neither leaves reqwest without TLS.
tls-native-tls = ["dep:native-tls", "reqwest/native-tls", "tokio-tungstenite?/native-tls"]
tls-rustls = ["dep:rustls", "reqwest/rustls", "tokio-tungstenite?/rustls-tls-native-roots"]
anthropic = []
# Separable because `jsonschema` costs ~30 crates. Default-on: switching it off
# is source-breaking for `run_structured` callers.
structured-output = ["dep:jsonschema"]
openai = []
# The Codex / ChatGPT provider speaks WebSocket; gate the transport dep here.
openai-codex = ["dep:tokio-tungstenite", "tokio/net"]
gemini = []
# The Vertex provider reuses the Anthropic model constants and the Gemini
# request/response codec, so it requires both of those providers.
vertex = ["anthropic", "gemini"]
# The Cloudflare AI Gateway provider is a thin proxy that wraps the
# Anthropic, OpenAI, and Gemini providers, so it requires all three.
cloudflare = ["anthropic", "openai", "gemini"]
# Deterministic record/replay provider wrapper. Captures (request -> response)
# pairs to a JSON cassette in record mode and serves them with no network in
# replay mode. Gated because cassette (de)serialization pulls in extra
# serde wiring most consumers never need.
record-replay = []
# Third-party model capability/pricing feed (models.dev / OpenRouter) plus the
# layered `ModelRegistry` resolver. Gated because it makes outbound HTTP to a
# third-party catalog; the default offline build keeps using the static
# `model_capabilities` table only.
model-discovery = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util", "net", "io-util"] }
# Server side of the TLS-rejection test; independent of the client's backend.
native-tls = { workspace = true }
wiremock = { workspace = true }
# Tier-C live smoke constructs a `Tool` whose `tier` is the core
# `ToolTier` enum (not re-exported through the `llm` glob).
agent-sdk-foundation = { workspace = true }

[lints]
workspace = true
