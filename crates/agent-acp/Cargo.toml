[package]
name = "agent-acp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "ACP (Agent Client Protocol) stdio transport: expose an agent as a newline-delimited JSON-RPC server, as spoken by the buzz-acp harness"
readme = "README.md"
keywords = ["agent", "acp", "json-rpc", "stdio", "buzz"]
categories = ["network-programming"]
# Internal for now, like the other server-side crates: consumed by git rev
# (satoshi, bipa), not published. Metadata above is kept publish-ready so the
# decision can be reversed without a manifest audit.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
uuid = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
