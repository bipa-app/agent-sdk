[package]
name = "agent-sdk-otel"
version = "0.18.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OpenTelemetry bootstrap helpers for the Agent SDK (OTLP exporter wiring + propagators)"
readme = "README.md"
keywords = ["agent", "llm", "opentelemetry", "otlp", "observability"]
categories = ["development-tools::profiling"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# No TLS feature: this is a library, so the backend is the final binary's call.
agent-sdk = { workspace = true, features = ["otel"] }
anyhow = { workspace = true }
log = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
# Featureless on purpose: only `tonic::metadata` is used here, and asking for
# `transport` would add the gRPC server half to every consumer.
tonic = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
