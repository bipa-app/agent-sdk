[package]
name = "agent-sdk-tools"
version = "0.17.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Tool traits, registry, hooks, and store contracts for the Agent SDK"
readme = "README.md"
keywords = ["agent", "llm", "ai", "tools"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
agent-sdk-foundation = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "rt"] }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tokio-util = { workspace = true }
time = { workspace = true }
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true
