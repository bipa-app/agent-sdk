[package]
name = "agent-service-proto"
version = "0.8.0"
edition = "2024"
license = "MIT"
# Internal: generated tonic/prost bindings for the host's gRPC contract.
# Excluded from the workspace (see root Cargo.toml `exclude`) because its
# build script invokes `protoc`; it is consumed only by `agent-service-host`
# and is intentionally not published. A future published gRPC-client binding
# would vendor or regenerate these from the `.proto` files directly.
publish = false
build = "build.rs"

# Excluded from the workspace, so these are kept in lockstep with the root by hand.
[dependencies]
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
prost-types = { version = "0.14.4", default-features = false, features = ["std"] }
tonic = { version = "0.14.6", default-features = false, features = ["router", "transport", "codegen"] }
tonic-prost = { version = "0.14.6", default-features = false }

[build-dependencies]
tonic-prost-build = { version = "0.14.6", default-features = false }
protoc-bin-vendored = { version = "3.2.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
